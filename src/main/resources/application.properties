spring.profiles.active=local

# Application
spring.application.name=LogAnalyzer

# Spring Batch - 시작 시 Job 자동 실행 방지
spring.batch.job.enabled=false

# Spring Boot Admin - /admin 경로로 고정
spring.boot.admin.context-path=/admin

# Actuator - Admin Server 연동용 전체 노출
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Dify Workflow API 연동 (docs/design/dify-api-spec.md 참고)
log-analyzer.dify.base-url=https://api.dify.ai
log-analyzer.dify.user=loganalyzer-batch
log-analyzer.dify.max-retries=3
log-analyzer.dify.timeout-seconds=60
log-analyzer.dify.workflow.date-format.api-key=${DIFY_DATE_FORMAT_API_KEY:}
log-analyzer.dify.workflow.log-suite.api-key=${DIFY_LOG_SUITE_API_KEY:}
