name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sync files to EC2
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete --exclude='.git' --exclude='target'
          path: ./
          remote_path: /home/ec2-user/project/
          remote_host: ${{ secrets.EC2_HOST }}
          remote_user: ${{ secrets.EC2_USER }}
          remote_key: ${{ secrets.EC2_SSH_KEY }}

      - name: Write Dify API keys to EC2 env file
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DIFY_DATE_FORMAT_API_KEY,DIFY_LOG_SUITE_API_KEY
          script: |
            mkdir -p /home/ec2-user/app
            cat > /home/ec2-user/app/loganalyzer.env <<EOF
            DIFY_DATE_FORMAT_API_KEY=${DIFY_DATE_FORMAT_API_KEY}
            DIFY_LOG_SUITE_API_KEY=${DIFY_LOG_SUITE_API_KEY}
            EOF
            chmod 600 /home/ec2-user/app/loganalyzer.env

            # loganalyzer.service 에 EnvironmentFile 지정이 없으면 최초 1회 추가
            if ! sudo grep -q '^EnvironmentFile=' /etc/systemd/system/loganalyzer.service; then
              sudo sed -i '/\[Service\]/a EnvironmentFile=/home/ec2-user/app/loganalyzer.env' /etc/systemd/system/loganalyzer.service
              sudo systemctl daemon-reload
            fi
        env:
          DIFY_DATE_FORMAT_API_KEY: ${{ secrets.DIFY_DATE_FORMAT_API_KEY }}
          DIFY_LOG_SUITE_API_KEY: ${{ secrets.DIFY_LOG_SUITE_API_KEY }}

      - name: Build & Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user/project

            # 빌드
            mvn clean package -DskipTests

            # app 폴더 준비
            mkdir -p /home/ec2-user/app

            # jar 이동
            mv target/loganalyzer-0.0.1-SNAPSHOT.jar /home/ec2-user/app/loganalyzer.jar

            # 재기동
            sudo systemctl restart loganalyzer

            echo "배포 완료"

      - name: Extract test logs on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            find /home/ec2-user/project/test_logs -name "*.gz" | while read f; do
              gunzip "$f" && echo "압축 해제 완료: $f"
            done
            echo "test_logs gz 처리 완료"
